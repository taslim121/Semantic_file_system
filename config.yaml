# Semantic File System Configuration
root_dir: "C:/Users/Taslim/OneDrive/Desktop/lsfs-test" # Directory to index and search
vector_db_dir: "./.lsfs_db" # Vector database storage

# Embedding Model (Lightweight & Fast)
embedding:
  model: "all-MiniLM-L6-v2" # 80MB model, very fast

# Search Settings
search:
  default_results: 5 # Number of results to return
  min_similarity: 0.3 # Minimum similarity threshold

# Indexing Settings
indexing:
  max_file_size_mb: 10 # Skip files larger than this
  max_text_bytes: 524288 # Only read this many bytes per file (prevents huge RAM use)
  chunk_size: 1200 # Characters per chunk
  chunk_overlap: 150 # Overlap for better recall
  max_chunks_per_file: 8 # Limit chunks per file (large files)
  batch_size: 32 # Embedding batch size
  skip_hidden: true # Skip hidden/system files
  use_default_excludes: true # Add default system/media excludes
  exclude_dirs:
    - ".git"
    - ".venv"
    - ".lsfs_db"
    - "__pycache__"
    - "node_modules"
    - "dist"
    - "build"
    - ".idea"
    - ".vscode"
    - "System Volume Information"
    - "$RECYCLE.BIN"
  exclude_extensions:
    - ".exe"
    - ".dll"
    - ".so"
    - ".dylib"
    - ".bin"
    - ".dat"
    - ".zip"
    - ".rar"
    - ".7z"
    - ".tar"
    - ".gz"
    - ".bz2"
    - ".iso"
    - ".png"
    - ".jpg"
    - ".jpeg"
    - ".gif"
    - ".bmp"
    - ".svg"
    - ".webp"
    - ".mp4"
    - ".mkv"
    - ".avi"
    - ".mov"
    - ".mp3"
    - ".wav"
    - ".flac"
    - ".aac"
    - ".ogg"
    - ".pdf"

# System
auto_mount: true # Auto-index on startup
